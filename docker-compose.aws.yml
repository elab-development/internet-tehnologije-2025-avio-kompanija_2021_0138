version: '3.8'

services:
  backend:
    image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_BACKEND_REPO }}:latest
    environment:
      - DEBUG=0
      - DJANGO_SETTINGS_MODULE=flight_backend.settings
      - SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
      - DATABASE_URL=${{ secrets.DATABASE_URL }}
      - ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: ["gunicorn", "flight_backend.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "4"]

  frontend:
    image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_FRONTEND_REPO }}:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=https://api.your-domain.com

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${{ secrets.DB_NAME }}
      - POSTGRES_USER=${{ secrets.DB_USER }}
      - POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - ${{ secrets.SSL_CERT_PATH }}:/etc/ssl/certs
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge